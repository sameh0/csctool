[project]
name = "csctool"
version = "1.0.0"
description = "Change Samsung CSC (region code) without root and without tripping Knox — open-source CLI for Linux and macOS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Sameh Sayed" }]
keywords = ["samsung", "csc", "android", "modem", "knox", "region-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/sameh0/csctool"
Repository = "https://github.com/sameh0/csctool"

[project.scripts]
csctool = "csctool:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["csctool"]
